<!DOCTYPE html>
<html>
    <head>
        <title>clicker game</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body style="background-color: cadetblue;">
        <h1 style="text-align: center;">CLICKER GAME</h1>
        <div style="display: flex; justify-content: space-between;">
            <h1 style="flex: 1;">ACTIVE BUFFS</h1>
            <button id="mybutton">CLICK ME</button>
            <h1 style="flex: 1; text-align: right;">SHOP</h1>
        </div>
       
        <h4 style="text-align: center">your score is </h4>
        <h3 id="myscore" style="text-align: center;">0</h3>
        <div style="display: flex; justify-content: space-between;">
            <div>
                <h3 style="text-align: left;">score per click is </h3><h3 id="scoreperclick">1</h3>
                <h3 style="text-align: left;">score per second is </h3><h3 id="scorepersecond">0</h3>
                <h3 style="text-align: left;">autoclicks per second are </h3><h3 id="clickspersecond">0</h3>
            </div>
            <div>
                <h3 style="text-align: right;" id="shopitem1text">cost = 10</h3>
                <button id="shopitem1">get +1 score per click</button>
                <progress id="shopitem1progress" value="1" max="10" style="width: 100%;"></progress>
                <h3 style="text-align: right;" id="shopitem2text">cost = 50</h3>
                <button id="shopitem2">get +1 score per second</button>
                <progress id="shopitem2progress" value="1" max="10" style="width: 100%;"></progress>
                <h3 style="text-align: right;" id="shopitem3text">cost = 300</h3>
                <button id="shopitem3">get +1 autoclick per second</button>
                <progress id="shopitem3progress" value="1" max="10" style="width: 100%;"></progress>
            </div>
        </div>
         <script src="script.js"></script>
    </body>
</html>
